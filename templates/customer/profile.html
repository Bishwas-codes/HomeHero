{% extends "base.html" %}

{% block title %}Customer Profile - HomeHero{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            
            <div class="mb-4">
                <a href="{{ url_for('customer.dashboard') }}" class="text-decoration-none text-muted small">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
                </a>
                <h2 class="fw-bold text-secondary mt-1">Manage Profile</h2>
                <p class="text-muted small">Update your personal contact details and password</p>
            </div>

            <div class="card-custom p-4 bg-white shadow-sm">
                <form method="POST" action="{{ url_for('customer.profile') }}">
                    
                    <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">Personal Information</h5>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Full Name</label>
                        <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Email Address</label>
                        <input type="email" class="form-control bg-light" value="{{ current_user.email }}" readonly>
                        <div class="form-text smaller">Email cannot be changed once registered.</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Phone Number</label>
                        <input type="tel" name="phone" class="form-control" value="{{ current_user.phone }}" required>
                    </div>

                    <h5 class="fw-bold text-primary mb-3 border-bottom pb-2">Change Password (Optional)</h5>
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Current Password</label>
                        <input type="password" name="current_password" class="form-control" placeholder="Leave blank if not changing">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold small">New Password</label>
                        <input type="password" name="new_password" class="form-control" placeholder="New password (min 6 chars)">
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 fw-bold">
                        <i class="fa-solid fa-floppy-disk me-2"></i> Save Profile Changes
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
