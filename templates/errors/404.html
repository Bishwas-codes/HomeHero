{% extends "base.html" %}

{% block title %}Page Not Found (404) - HomeHero{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card-custom p-5 bg-white shadow-sm d-inline-block" style="max-width: 550px;">
        <div class="text-primary fs-1 mb-3">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <h2 class="fw-bold text-secondary mb-2">404 - Page Not Found</h2>
        <p class="text-muted small mb-4">The requested page or resource could not be found or has been moved.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary-custom px-4">
            <i class="fa-solid fa-house me-1"></i> Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
