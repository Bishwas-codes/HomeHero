{% extends "base.html" %}

{% block title %}Server Error (500) - HomeHero{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="card-custom p-5 bg-white shadow-sm d-inline-block" style="max-width: 550px;">
        <div class="text-danger fs-1 mb-3">
            <i class="fa-solid fa-circle-exclamation"></i>
        </div>
        <h2 class="fw-bold text-secondary mb-2">500 - Internal Server Error</h2>
        <p class="text-muted small mb-4">An unexpected error occurred while processing your request. Please try again or return to the homepage.</p>
        <a href="{{ url_for('index') }}" class="btn btn-primary-custom px-4">
            <i class="fa-solid fa-house me-1"></i> Return to Homepage
        </a>
    </div>
</div>
{% endblock %}
